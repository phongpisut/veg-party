name: Build and Publish to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Read from the "gh-pages" environment variable (set under
          # Settings > Environments > gh-pages > Environment variables).
          VITE_GAME_TAG: ${{ vars.VITE_GAME_TAG }}
      # Pushes the built site to the gh-pages branch; you pick this branch
      # under Settings > Pages > Source "Deploy from a branch".
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
